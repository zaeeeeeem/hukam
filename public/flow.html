<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hukam · live flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Tokens borrowed from the Graphi portal (frontend/src/app/globals.css). */
  :root {
    --bg:#000; --panel:#0a0a0c; --fg:#fff; --dim:rgba(255,255,255,.58); --faint:rgba(255,255,255,.5);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
    --active:#0098f3; --glow:#1f77f6; --attention:#ff7a2f; --success:#34d399; --danger:#f04438; --orange:#da4e24;
    --wa:#25d366; --gemma:#8ab4f8;
    --claude:#e0875f; --codex:#4fb4ff; --opencode:#c084fc;
    --sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; color:var(--fg); font:17px/1.45 var(--sans); overflow:hidden;
    background:
      radial-gradient(55% 60% at 100% 100%, rgba(31,95,216,.22), transparent 70%),
      radial-gradient(50% 55% at 0% 100%, rgba(162,41,4,.22), transparent 70%),
      radial-gradient(40% 40% at 50% 0%, rgba(31,119,246,.08), transparent 70%), #000;
  }
  .mono { font-family:var(--mono); }

  header { height:76px; display:flex; align-items:center; gap:18px; padding:0 28px; border-bottom:1px solid var(--line); }
  .logo { width:38px; height:38px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #9fd0ff, #1f77f6 45%, #a22904 100%); box-shadow:0 0 24px rgba(31,119,246,.45); flex:none; }
  h1 { margin:0; font-size:30px; font-weight:700; letter-spacing:-.02em; }
  .tag { color:var(--dim); font-size:18px; }
  .spacer { flex:1; }
  .stat { display:flex; flex-direction:column; align-items:center; padding:6px 18px; border-left:1px solid var(--line); }
  .stat b { font:600 26px/1.1 var(--mono); }
  .stat span { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px; border:1px solid var(--line2); background:rgba(255,255,255,.04); font:500 14px var(--mono); color:var(--dim); text-decoration:none; }
  .pill.live { color:var(--success); border-color:rgba(52,211,153,.45); }
  .pill.live::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--success); box-shadow:0 0 10px var(--success); animation:blink 1.4s infinite; }
  a.pill:hover { color:var(--fg); }

  main { display:grid; grid-template-columns:1fr 360px; height:calc(100vh - 76px); }
  #canvas { position:relative; padding:28px 28px 72px; overflow:hidden; }
  #edges { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #edges path { fill:none; stroke:rgba(255,255,255,.16); stroke-width:2; transition:stroke .4s ease, stroke-width .4s ease; }
  #edges path.reply { stroke-dasharray:6 7; }
  #edges path.hot { stroke:var(--c, var(--active)); stroke-width:3; filter:drop-shadow(0 0 6px var(--c, var(--active))); }
  #edges .label { fill:var(--faint); font:500 12px var(--mono); letter-spacing:.08em; text-transform:uppercase; }

  .grid { position:relative; display:grid; height:100%; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr) 150px minmax(0, 1.2fr); column-gap:54px; z-index:1; }
  .col { display:flex; flex-direction:column; gap:22px; min-height:0; justify-content:center; }

  .node {
    position:relative; border-radius:20px; border:1px solid var(--line2); padding:16px 18px;
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.01)), var(--panel);
    box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    transition:border-color .4s ease, box-shadow .4s ease, opacity .4s ease;
  }
  .node.flash { border-color:var(--c, var(--active)); box-shadow:0 0 0 1px var(--c, var(--active)), 0 0 38px color-mix(in srgb, var(--c, var(--active)) 45%, transparent), 0 20px 50px rgba(0,0,0,.55); }
  .nh { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .ic { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:none; background:color-mix(in srgb, var(--c) 18%, transparent); color:var(--c); border:1px solid color-mix(in srgb, var(--c) 40%, transparent); }
  .ic svg { width:19px; height:19px; }
  .nt { font-weight:600; font-size:19px; }
  .ns { margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; font:500 12px var(--mono); color:var(--faint); text-transform:uppercase; letter-spacing:.08em; }
  .empty { color:var(--faint); font-size:15px; }

  /* WhatsApp */
  #wa { --c:var(--wa); flex:1; max-height:640px; display:flex; flex-direction:column; min-height:0; }
  #chat { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; overflow:hidden; min-height:0; }
  .b { max-width:92%; padding:10px 13px; border-radius:14px; font-size:16px; white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden; flex:none; }
  .b.in { background:#12301f; border:1px solid #1f5a39; border-top-left-radius:4px; }
  .b.out { background:rgba(255,255,255,.06); border:1px solid var(--line2); margin-left:auto; border-top-right-radius:4px; }
  .b .who { display:block; font:500 12px var(--mono); color:var(--dim); margin-bottom:3px; }
  .b img { display:block; max-width:100%; max-height:120px; border-radius:8px; margin-bottom:6px; }
  .chip { display:inline-block; padding:3px 9px; border-radius:999px; border:1px solid var(--line2); background:rgba(255,255,255,.05); font:500 12px var(--mono); color:var(--dim); margin:0 4px 4px 0; }

  /* Whisper */
  #whisper { --c:#f5c451; opacity:.5; }
  #whisper.on { opacity:1; }
  #whisper .tx { font-size:15px; color:var(--dim); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }

  /* Gemma */
  #gemma { --c:var(--gemma); }
  #gemma.high { --c:var(--attention); border-color:rgba(255,122,47,.6); }
  #gemma.ok { --c:var(--success); border-color:rgba(52,211,153,.6); }
  #gemma.no { --c:var(--danger); border-color:rgba(240,68,56,.6); }
  .act { font:600 26px/1.2 var(--mono); color:var(--c); overflow-wrap:anywhere; }
  .kv { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px; }
  .kv .chip { font-size:13px; color:var(--fg); }
  .risk-high { color:var(--attention) !important; border-color:rgba(255,122,47,.55) !important; }
  .reason { color:var(--dim); font-size:15px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .saw { font-size:15px; margin-top:6px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .gate { margin-top:12px; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,122,47,.5); background:rgba(255,122,47,.1); font-size:15px; }
  .gate b { font:600 22px var(--mono); color:var(--attention); letter-spacing:.06em; }
  #gemma.ok .gate { border-color:rgba(52,211,153,.5); background:rgba(52,211,153,.1); }
  #gemma.ok .gate b { color:var(--success); }
  #gemma.no .gate { border-color:rgba(240,68,56,.5); background:rgba(240,68,56,.1); }
  #gemma.no .gate b { color:var(--danger); }
  .model { margin-top:8px; font:12px var(--mono); color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Superset */
  #superset { --c:var(--glow); text-align:center; padding:20px 14px; }
  #superset .ic { margin:0 auto 10px; width:52px; height:52px; border-radius:16px; }
  #superset .ic svg { width:28px; height:28px; }
  #superset .nt { font-size:20px; }
  #superset .sub { font:12px var(--mono); color:var(--faint); margin-top:4px; text-transform:uppercase; letter-spacing:.08em; }
  #superset .cnt { font:600 32px var(--mono); margin-top:10px; }

  /* Agents */
  #agents { gap:16px; }
  .agent { --c:var(--codex); padding:14px 16px; border-left:3px solid var(--c); }
  .agent.claude { --c:var(--claude); } .agent.codex { --c:var(--codex); } .agent.opencode { --c:var(--opencode); }
  .agent .top { display:flex; align-items:center; gap:10px; }
  .agent .name { font:600 18px var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .agent .type { font:600 12px var(--mono); padding:2px 9px; border-radius:999px; color:var(--c); border:1px solid color-mix(in srgb, var(--c) 50%, transparent); background:color-mix(in srgb, var(--c) 12%, transparent); text-transform:lowercase; flex:none; }
  .st { margin-left:auto; display:inline-flex; align-items:center; gap:7px; font:500 13px var(--mono); flex:none; color:var(--dim); }
  .st::before { content:""; width:9px; height:9px; border-radius:50%; background:currentColor; }
  .st.working { color:var(--active); } .st.working::before { animation:blink 1s infinite; box-shadow:0 0 10px var(--active); }
  .st.idle { color:var(--success); } .st.blocked { color:var(--attention); } .st.stopped, .st.exited { color:var(--danger); }
  .agent.working { box-shadow:0 0 0 1px rgba(0,152,243,.35), 0 0 30px rgba(0,152,243,.18), 0 20px 50px rgba(0,0,0,.55); }
  .agent.working::after { content:""; position:absolute; left:16px; right:16px; bottom:0; height:2px; background:linear-gradient(90deg, transparent, var(--active), transparent); background-size:50% 100%; background-repeat:no-repeat; animation:scan 1.6s linear infinite; }
  .agent .p { margin-top:6px; font-size:15px; color:var(--dim); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .agent .sum { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:15px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .agent .row { display:flex; gap:10px; align-items:flex-start; }
  .agent .row > div { flex:1; min-width:0; }
  .agent .thumb { width:84px; height:84px; object-fit:cover; border-radius:10px; border:1px solid var(--line2); flex:none; margin-top:8px; }
  .more { color:var(--faint); font:13px var(--mono); text-align:center; }

  /* Timeline */
  aside { border-left:1px solid var(--line); background:rgba(10,10,12,.7); display:flex; flex-direction:column; min-height:0; }
  aside h2 { margin:0; padding:18px 22px 12px; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); display:flex; align-items:center; gap:8px; }
  #log { flex:1; overflow:hidden; padding:0 14px 14px; display:flex; flex-direction:column; gap:6px; }
  .ev { display:grid; grid-template-columns:76px 1fr; gap:4px 10px; padding:9px 10px; border-radius:12px; border:1px solid transparent; flex:none; }
  .ev.new { animation:in .5s ease-out; border-color:var(--line2); background:rgba(255,255,255,.04); }
  .ev time { font:12px var(--mono); color:var(--faint); padding-top:3px; }
  .ev .t { font:600 12px var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--c, var(--dim)); }
  .ev .d { grid-column:2; font-size:15px; color:rgba(255,255,255,.82); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; overflow-wrap:anywhere; }

  .dot { fill:var(--c, #fff); filter:drop-shadow(0 0 8px var(--c, #fff)) drop-shadow(0 0 3px #fff); }

  @keyframes blink { 50% { opacity:.3; } }
  @keyframes scan { from { background-position:-50% 0; } to { background-position:150% 0; } }
  @keyframes in { from { opacity:0; transform:translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
  @media (max-width: 1400px) { main { grid-template-columns:1fr 300px; } .grid { column-gap:40px; } }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <h1>Hukam</h1>
  <span class="tag">WhatsApp → Gemma 4 → your agents</span>
  <span class="spacer"></span>
  <div class="stat"><b id="nMsg">0</b><span>messages</span></div>
  <div class="stat"><b id="nRun">0</b><span>running</span></div>
  <div class="stat"><b id="nDone">0</b><span>done</span></div>
  <span id="via" class="pill">connecting…</span>
  <a class="pill" href="/">Classic view</a>
</header>
<main>
  <section id="canvas">
    <svg id="edges"></svg>
    <div class="grid">
      <div class="col">
        <div class="node" id="wa">
          <div class="nh"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div><span class="nt">WhatsApp</span><span class="ns" id="waMode">chat</span></div>
          <div id="chat"><p class="empty">Waiting for a message…</p></div>
        </div>
      </div>
      <div class="col">
        <div class="node" id="whisper">
          <div class="nh" style="margin-bottom:6px"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></div><span class="nt">Whisper</span><span class="ns">voice → text</span></div>
          <div class="tx" id="whisperTx">Lights up for voice notes</div>
        </div>
        <div class="node" id="gemma">
          <div class="nh"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10.7l-5.6 2.4L12 19l-2.4-5.9L4 10.7l6.1-1.9Z"/></svg></div><span class="nt">Gemma 4</span><span class="ns">decides</span></div>
          <div id="gemmaBody"><p class="empty">No decisions yet.</p></div>
        </div>
      </div>
      <div class="col">
        <div class="node" id="superset">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
          <div class="nt">Superset</div>
          <div class="sub">orchestrator</div>
          <div class="cnt" id="ssCount">0</div>
          <div class="sub">sessions</div>
        </div>
      </div>
      <div class="col" id="agents"><div class="node"><p class="empty" style="margin:0">No agents yet. Send a task from WhatsApp.</p></div></div>
    </div>
  </section>
  <aside>
    <h2>Timeline</h2>
    <div id="log"></div>
  </aside>
</main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const time = (at) => new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const params = new URLSearchParams(location.search);
  const DEMO = params.has("demo");
  const LOADED = Date.now() - 1500;
  const MAX_AGENTS = 4;
  const AGENT_COLORS = { claude: "var(--claude)", codex: "var(--codex)", opencode: "var(--opencode)" };
  const SVGNS = "http://www.w3.org/2000/svg";

  const seen = new Set();
  const agents = new Map(); // name -> {agent, prompt, status, summary, thumb, preview, order}
  const chat = [];
  let order = 0, nMsg = 0, nDone = 0, lastVoiceAt = 0;

  // ---------- edges ----------
  const svg = $("edges");
  const paths = new Map(); // id -> path element
  function rel(el) {
    const c = $("canvas").getBoundingClientRect(), r = el.getBoundingClientRect();
    return { l: r.left - c.left, r: r.right - c.left, t: r.top - c.top, b: r.bottom - c.top, cx: (r.left + r.right) / 2 - c.left, cy: (r.top + r.bottom) / 2 - c.top };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function horiz(a, b) {
    const x1 = a.r, y1 = clamp(b.cy, a.t + 28, a.b - 28), x2 = b.l, y2 = b.cy, dx = (x2 - x1) * 0.5;
    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  }
  function setPath(id, d, cls = "") {
    let p = paths.get(id);
    if (!p) { p = document.createElementNS(SVGNS, "path"); p.id = `e-${id}`; svg.append(p); paths.set(id, p); }
    p.setAttribute("d", d);
    p.setAttribute("class", `${cls} ${p.classList.contains("hot") ? "hot" : ""}`.trim());
  }
  function layout() {
    const wa = rel($("wa")), wh = rel($("whisper")), gm = rel($("gemma")), ss = rel($("superset"));
    setPath("wa-whisper", horiz(wa, wh));
    setPath("wa-gemma", horiz(wa, gm));
    setPath("whisper-gemma", `M${wh.cx},${wh.b} L${gm.cx},${gm.t}`);
    setPath("gemma-superset", horiz(gm, ss));
    const live = new Set(["wa-whisper", "wa-gemma", "whisper-gemma", "gemma-superset", "reply"]);
    for (const el of document.querySelectorAll("[data-agent]")) {
      const id = `ag-${el.dataset.agent}`;
      live.add(id);
      setPath(id, horiz(ss, rel(el)));
    }
    // Return path: Superset -> down -> left along the bottom -> up into WhatsApp.
    const yb = $("canvas").clientHeight - 30, r = 18, sx = ss.cx, wx = wa.cx;
    setPath("reply", `M${sx},${ss.b} L${sx},${yb - r} Q${sx},${yb} ${sx - r},${yb} L${wx + r},${yb} Q${wx},${yb} ${wx},${yb - r} L${wx},${wa.b}`, "reply");
    for (const [id, p] of paths) if (!live.has(id)) { p.remove(); paths.delete(id); }
    let lab = svg.querySelector(".label");
    if (!lab) { lab = document.createElementNS(SVGNS, "text"); lab.setAttribute("class", "label"); lab.textContent = "reply → WhatsApp"; svg.append(lab); }
    lab.setAttribute("x", (sx + wx) / 2 - 60); lab.setAttribute("y", yb - 10);
  }
  new ResizeObserver(() => layout()).observe($("canvas"));
  addEventListener("resize", layout);

  function flash(el, color, ms = 1400) {
    if (!el) return;
    if (color) el.style.setProperty("--c", color);
    el.classList.add("flash");
    clearTimeout(el._f);
    el._f = setTimeout(() => { el.classList.remove("flash"); if (color && !el.classList.contains("agent")) el.style.removeProperty("--c"); }, ms);
  }
  // Animate a glowing dot along an edge, then call done().
  function pulse(id, color = "var(--active)", { reverse = false, ms = 900 } = {}) {
    return new Promise((resolve) => {
      const p = paths.get(id);
      if (!p) return resolve();
      p.style.setProperty("--c", color);
      p.classList.add("hot");
      clearTimeout(p._h);
      p._h = setTimeout(() => p.classList.remove("hot"), ms + 700);
      if (reduce) return resolve();
      const len = p.getTotalLength();
      const dots = [0, 1, 2].map((i) => {
        const c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("r", i === 0 ? 7 : 4 - i);
        c.setAttribute("class", "dot");
        c.style.setProperty("--c", color);
        c.style.opacity = 1 - i * 0.3;
        svg.append(c);
        return c;
      });
      const t0 = performance.now();
      (function step(now) {
        const k = Math.min(1, (now - t0) / ms);
        dots.forEach((c, i) => {
          const kk = Math.max(0, k - i * 0.05), e = kk < 0.5 ? 2 * kk * kk : 1 - (-2 * kk + 2) ** 2 / 2;
          const pt = p.getPointAtLength((reverse ? 1 - e : e) * len);
          c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y);
        });
        if (k < 1) requestAnimationFrame(step); else { dots.forEach((c) => c.remove()); resolve(); }
      })(t0);
    });
  }
  // Serialize animations so a burst of events plays as a readable sequence.
  let queue = Promise.resolve();
  const play = (fn) => { queue = queue.then(fn).catch(() => {}); };

  // ---------- nodes ----------
  function renderChat() {
    const el = $("chat");
    el.innerHTML = chat.slice(-5).map((m) => {
      const a = m.attachment;
      const att = !a ? "" : a.kind === "image" ? `<img src="${esc(a.url)}" alt="" loading="lazy" />` : `<span class="chip">📄 ${esc(a.name || "PDF")}</span><br/>`;
      const who = m.dir === "in"
        ? `${esc(m.from || "you")} · ${esc(m.chat || "DM")}${m.voice ? " · 🎙️ voice" : ""}${a ? (a.kind === "image" ? " · 🖼️ photo" : " · 📄 pdf") : ""}`
        : `Hukam → ${esc(m.chat || "DM")}`;
      return `<div class="b ${m.dir}"><span class="who">${who} · ${time(m.at)}</span>${att}${esc(m.text)}</div>`;
    }).join("") || `<p class="empty">Waiting for a message…</p>`;
    const last = chat.filter((m) => m.dir === "in").at(-1);
    $("waMode").textContent = last ? (last.chat && last.chat !== "DM" ? `group · ${last.chat}` : "DM") : "chat";
  }

  function renderGemma(e) {
    const g = $("gemma");
    g.classList.remove("high", "ok", "no");
    if (e.type === "intent") {
      const i = e.intent || {};
      const high = i.risk === "high";
      if (high) g.classList.add("high");
      const target = i.agent ? ` → ${i.agent}` : i.session ? ` → @${i.session}` : "";
      $("gemmaBody").innerHTML = `<div class="act">${esc(i.action || "?")}${esc(target)}</div>
        <div class="kv">${i.name ? `<span class="chip">name: ${esc(i.name)}</span>` : ""}${i.session ? `<span class="chip">@${esc(i.session)}</span>` : ""}<span class="chip ${high ? "risk-high" : ""}">risk: ${esc(i.risk || "low")}</span>${e.attachment ? `<span class="chip">👁 vision</span>` : ""}</div>
        ${i.description ? `<div class="saw">👀 ${esc(i.description)}</div>` : ""}
        <div class="reason">${esc(i.reason || "")}</div>
        <div class="model">${esc(String(e.model || "").split(" > ")[0])}</div>`;
    } else if (e.type === "gate") {
      g.classList.add("high");
      $("gemmaBody").innerHTML = `<div class="act">⚠ approval needed</div>
        <div class="kv"><span class="chip risk-high">risk: high</span></div>
        <div class="reason">${esc(e.reason || "")}</div>
        <div class="gate">Owner replies <b>yes ${esc(e.code)}</b> or <b>no ${esc(e.code)}</b></div>`;
    } else if (e.type === "approval") {
      g.classList.add(e.ok ? "ok" : "no");
      $("gemmaBody").innerHTML = `<div class="act">${e.ok ? "✓ approved" : "✕ cancelled"}</div>
        <div class="reason">${esc(e.prompt || "")}</div>
        <div class="gate"><b>${e.ok ? "yes" : "no"} ${esc(e.code)}</b> · ${e.ok ? "running it now" : "nothing was run"}</div>`;
    }
  }

  function agentEl(name) { return document.querySelector(`[data-agent="${CSS.escape(name)}"]`); }
  function renderAgents() {
    const list = [...agents.entries()].sort((a, b) => b[1].order - a[1].order);
    const shown = list.slice(0, MAX_AGENTS);
    const box = $("agents");
    box.innerHTML = shown.map(([name, a]) => {
      const type = (a.agent || "agent").toLowerCase();
      return `<div class="node agent ${esc(type)} ${a.status === "working" ? "working" : ""}" data-agent="${esc(name)}">
        <div class="top"><span class="name">${esc(name)}</span><span class="type">${esc(type)}</span><span class="st ${esc(a.status)}">${esc(a.status)}</span></div>
        <div class="row"><div>
          <div class="p">${esc(a.prompt || "")}</div>
          ${a.summary ? `<div class="sum">✅ ${esc(a.summary.split("\n")[0])}</div>` : ""}
          ${a.preview ? `<div class="kv" style="margin:8px 0 0"><span class="chip">📸 live preview sent</span></div>` : ""}
        </div>${a.thumb ? `<img class="thumb" src="${esc(a.thumb)}" alt="" />` : ""}</div>
      </div>`;
    }).join("") + (list.length > MAX_AGENTS ? `<div class="more">+${list.length - MAX_AGENTS} earlier sessions</div>` : "");
    if (!list.length) box.innerHTML = `<div class="node"><p class="empty" style="margin:0">No agents yet. Send a task from WhatsApp.</p></div>`;
    $("ssCount").textContent = agents.size;
    $("nRun").textContent = [...agents.values()].filter((a) => a.status === "working").length;
    requestAnimationFrame(layout);
  }

  // ---------- timeline ----------
  const LOG = {
    inbound: ["message", "var(--wa)", (e) => `${e.voice ? "🎙️ " : ""}${e.attachment ? (e.attachment.kind === "image" ? "🖼️ " : "📄 ") : ""}${e.from || "you"}${e.chat && e.chat !== "DM" ? ` @ ${e.chat}` : ""}: ${e.text || ""}`],
    voice: ["whisper", "#f5c451", (e) => `${e.text} (${e.ms} ms)`],
    intent: ["gemma", "var(--gemma)", (e) => `${e.intent?.action}${e.intent?.agent ? ` → ${e.intent.agent}` : ""}${e.intent?.session ? ` → @${e.intent.session}` : ""} · risk ${e.intent?.risk || "low"}`],
    gate: ["approval?", "var(--attention)", (e) => `code ${e.code}: ${e.reason || ""}`],
    approval: ["approval", "var(--success)", (e) => `${e.ok ? "approved" : "cancelled"} ${e.code}`],
    spawn: ["spawn", "var(--active)", (e) => `${e.name} on ${e.agent}`],
    send: ["follow-up", "var(--active)", (e) => `@${e.name}: ${e.prompt || ""}`],
    status: ["status", "var(--dim)", (e) => `${e.name} → ${e.status}`],
    done: ["done", "var(--success)", (e) => `${e.name}: ${(e.summary || "").split("\n")[0]}`],
    artifact: ["artifact", "var(--opencode)", (e) => `${e.name} made ${e.path}`],
    preview: ["preview", "var(--opencode)", (e) => `${e.name} page screenshot sent`],
    reply: ["reply", "var(--wa)", (e) => (e.text || "").split("\n")[0]],
    error: ["error", "var(--danger)", (e) => e.message || ""],
    ready: ["ready", "var(--success)", (e) => `router up · ${e.groups?.length || 0} group(s)`],
  };
  function log(e, isLive) {
    const L = LOG[e.type];
    if (!L) return;
    const div = document.createElement("div");
    div.className = `ev${isLive ? " new" : ""}`;
    div.style.setProperty("--c", L[1]);
    div.innerHTML = `<time>${time(e.at)}</time><span class="t">${esc(L[0])}</span><span class="d">${esc(L[2](e))}</span>`;
    $("log").prepend(div);
    while ($("log").children.length > 60) $("log").lastChild.remove();
    if (isLive) setTimeout(() => div.classList.remove("new"), 4000);
  }

  // ---------- events ----------
  function onEvent(e) {
    if (!e || !e.type || !e.at) return;
    const key = `${e.at}|${e.type}|${e.name || e.code || e.text || ""}`;
    if (seen.has(key)) return;
    seen.add(key);
    if (!LOG[e.type]) return;
    const isLive = DEMO || Date.parse(e.at) > LOADED;
    log(e, isLive);
    const anim = (fn) => { if (isLive) play(fn); };

    switch (e.type) {
      case "voice":
        lastVoiceAt = Date.parse(e.at);
        $("whisper").classList.add("on");
        $("whisperTx").textContent = `“${e.text}”`;
        anim(async () => { flash($("wa")); await pulse("wa-whisper", "var(--wa)"); flash($("whisper"), "#f5c451"); });
        break;
      case "inbound":
        nMsg++; $("nMsg").textContent = nMsg;
        chat.push({ dir: "in", ...e });
        if (!e.voice) $("whisper").classList.remove("on");
        renderChat();
        anim(async () => { if (e.voice) await pulse("whisper-gemma", "#f5c451", { ms: 600 }); else { flash($("wa"), "var(--wa)"); await pulse("wa-gemma", "var(--wa)"); } flash($("gemma"), "var(--gemma)", 1800); });
        break;
      case "intent":
        renderGemma(e);
        anim(async () => { flash($("gemma"), e.intent?.risk === "high" ? "var(--attention)" : "var(--gemma)"); if (["spawn", "send", "stop"].includes(e.intent?.action) && e.intent?.risk !== "high") { await pulse("gemma-superset", "var(--gemma)"); flash($("superset")); } });
        break;
      case "gate":
        renderGemma(e);
        anim(async () => flash($("gemma"), "var(--attention)", 2500));
        break;
      case "approval":
        renderGemma(e);
        anim(async () => { flash($("gemma"), e.ok ? "var(--success)" : "var(--danger)", 2000); if (e.ok) await pulse("gemma-superset", "var(--success)"); });
        break;
      case "spawn":
        agents.set(e.name, { agent: e.agent, prompt: e.prompt, status: "working", order: ++order });
        renderAgents();
        anim(async () => { flash($("superset")); await pulse(`ag-${e.name}`, AGENT_COLORS[e.agent] || "var(--active)"); flash(agentEl(e.name), AGENT_COLORS[e.agent]); });
        break;
      case "send": {
        const a = agents.get(e.name);
        if (a) { Object.assign(a, { prompt: e.prompt, status: "working", summary: "", order: ++order }); renderAgents(); }
        anim(async () => { await pulse(`ag-${e.name}`, AGENT_COLORS[a?.agent] || "var(--active)"); flash(agentEl(e.name)); });
        break;
      }
      case "status": {
        const a = agents.get(e.name);
        if (a) { a.status = e.status; renderAgents(); }
        break;
      }
      case "done": {
        nDone++; $("nDone").textContent = nDone;
        const a = agents.get(e.name);
        if (a) { Object.assign(a, { status: e.state || "idle", summary: e.summary }); renderAgents(); }
        anim(async () => { flash(agentEl(e.name), "var(--success)"); await pulse(`ag-${e.name}`, "var(--success)", { reverse: true }); flash($("superset"), "var(--success)"); });
        break;
      }
      case "artifact":
      case "preview": {
        const a = agents.get(e.name);
        if (a && e.type === "preview") { a.preview = true; renderAgents(); }
        anim(async () => flash(agentEl(e.name), "var(--opencode)"));
        break;
      }
      case "reply": {
        chat.push({ dir: "out", ...e });
        renderChat();
        // "🎨 <name>: path" replies carry the agent-made image; show it on that agent's node.
        const m = /^🎨 ([^:]+):/.exec(e.text || "");
        if (m && e.attachment?.kind === "image" && agents.has(m[1])) { agents.get(m[1]).thumb = e.attachment.url; renderAgents(); }
        anim(async () => { await pulse("reply", "var(--wa)", { ms: 1100 }); flash($("wa"), "var(--wa)"); });
        break;
      }
      case "error":
        anim(async () => flash($("gemma"), "var(--danger)", 2000));
        break;
    }
  }

  // ---------- transport ----------
  function setVia(text, live) { $("via").textContent = text; $("via").className = `pill${live ? " live" : ""}`; }

  if (DEMO) {
    setVia("demo replay", true);
    const t = (s) => new Date(Date.now() + s).toISOString();
    const script = [
      [400, { type: "inbound", from: "Zaeem", chat: "DM", owner: true, text: "build me a landing page for my chai stall" }],
      [1600, { type: "intent", model: "gemma-4-26b-a4b-it", intent: { action: "spawn", agent: "codex", name: "chai-landing", prompt: "Build a one-page landing site for a chai stall with menu and map.", risk: "low", reason: "New web task, codex is good at scaffolding pages." } }],
      [800, { type: "spawn", name: "chai-landing", agent: "codex", prompt: "Build a one-page landing site for a chai stall with menu and map." }],
      [400, { type: "reply", chat: "DM", text: "🚀 Started *chai-landing* on codex." }],
      [1800, { type: "voice", text: "Claude se bolo README mein setup steps add kar de", ms: 1180 }],
      [300, { type: "inbound", from: "Zaeem", chat: "DM", owner: true, voice: true, text: "Claude se bolo README mein setup steps add kar de" }],
      [1400, { type: "intent", model: "gemma-4-26b-a4b-it", intent: { action: "spawn", agent: "claude", name: "readme-setup", prompt: "Add setup steps to the README.", risk: "low", reason: "Voice note in Urdu asking Claude to document setup." } }],
      [700, { type: "spawn", name: "readme-setup", agent: "claude", prompt: "Add setup steps to the README." }],
      [1600, { type: "inbound", from: "Ali", chat: "Hukam", owner: false, text: "delete the old deploy branch and force push main" }],
      [1400, { type: "intent", model: "gemma-4-26b-a4b-it", intent: { action: "spawn", agent: "opencode", name: "cleanup", prompt: "Delete old deploy branch and force-push main.", risk: "high", reason: "Force-push and branch deletion are destructive." } }],
      [500, { type: "gate", code: "K7Q2", reason: "Force-push and branch deletion are destructive.", prompt: "Delete old deploy branch and force-push main." }],
      [1500, { type: "status", name: "chai-landing", status: "idle" }],
      [300, { type: "done", name: "chai-landing", state: "idle", summary: "Landing page built with menu, hours and a map embed." }],
      [500, { type: "reply", chat: "DM", text: "✅ chai-landing finished: landing page built." }],
      [800, { type: "preview", name: "chai-landing" }],
      [1400, { type: "approval", code: "K7Q2", ok: false, prompt: "Delete old deploy branch and force-push main." }],
      [400, { type: "reply", chat: "Hukam", text: "❌ Cancelled." }],
    ];
    let delay = 0;
    for (const [d, ev] of script) { delay += d; setTimeout(() => onEvent({ ...ev, at: new Date().toISOString() }), delay); }
  } else {
    // History and fallback over local SSE; live events over DNotifier when configured.
    const es = new EventSource("/events");
    es.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch {} };
    es.onerror = () => { if ($("via").textContent !== "● DNotifier live") setVia("reconnecting…", false); };
    es.onopen = () => { if (!$("via").classList.contains("live")) setVia("local stream", false); };
    const cfg = await fetch("/config").then((r) => r.json()).catch(() => ({}));
    if (cfg.appId) {
      try {
        const { DNotifier } = await import("https://esm.sh/@dnotifier-realtime/dnotifier@1.1.25");
        const n = new DNotifier({
          appId: cfg.appId, secret: cfg.secret, transport: "ws", userId: cfg.userId,
          onConnected: () => setVia("● DNotifier live", true),
          onDisconnected: () => setVia("local stream", false),
          onMessage: (msg) => {
            const data = msg?.payload?.toJSON?.() ?? msg?.payload ?? msg;
            const event = data?.event ?? data?.data?.event;
            if (event) onEvent(event);
          },
        });
        await n.connect();
      } catch (err) { console.error("DNotifier", err); setVia("local stream", false); }
    } else setVia("local stream", false);
  }
  layout();
</script>
</body>
</html>
